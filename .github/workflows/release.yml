name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_draft:
        description: "Create GitHub Release as draft"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run core unit tests
        working-directory: src-tauri
        run: cargo test -p isocraft-core --locked

      - name: Sync version from release tag
        if: github.event_name == 'release' || github.ref_type == 'tag'
        shell: pwsh
        env:
          RAW_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $tag = $env:RAW_TAG.Trim()
          if ($tag -notmatch '^v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            Write-Host "Tag '$tag' is not a SemVer version; keeping existing project version."
            exit 0
          }
          $ver = $Matches[1]
          $baseParts = ($ver -split '-')[0]
          $winVer = "$baseParts.0"
          Write-Host "Syncing project version to $ver (Windows manifest: $winVer)"

          $tauriConf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $tauriConf.version = $ver
          ($tauriConf | ConvertTo-Json -Depth 16) | Set-Content 'src-tauri/tauri.conf.json' -Encoding utf8NoBOM

          $pkgJson = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $pkgJson.version = $ver
          ($pkgJson | ConvertTo-Json -Depth 16) | Set-Content 'package.json' -Encoding utf8NoBOM

          foreach ($toml in @('src-tauri/Cargo.toml', 'src-tauri/crates/core/Cargo.toml')) {
            $raw = Get-Content $toml -Raw
            $updated = [regex]::Replace($raw, '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`"", 1)
            Set-Content $toml -Value $updated -Encoding utf8NoBOM -NoNewline
          }

          $manifestPath = 'src-tauri/app.manifest'
          $manifestRaw = Get-Content $manifestPath -Raw
          $manifestUpdated = [regex]::Replace($manifestRaw, '(<assemblyIdentity\s+version=")[^"]+(")', "`${1}$winVer`${2}", 1)
          Set-Content $manifestPath -Value $manifestUpdated -Encoding utf8NoBOM -NoNewline

      - name: Fetch bundled external tools (wimlib & xorriso)
        shell: pwsh
        run: .\scripts\fetch-tools.ps1

      - name: Build and attach artifacts to existing GitHub Release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          releaseName: ${{ github.event.release.name }}
          releaseBody: ${{ github.event.release.body }}
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease }}
          generateReleaseNotes: false
          updaterJsonPreferNsis: true

      - name: Build and publish Tauri release (tag push / manual)
        if: github.event_name != 'release'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ISOCraft v__VERSION__"
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft != false }}
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
