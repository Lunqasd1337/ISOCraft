name: "Feature Request / Предложение функции"
description: "Suggest a new feature, UI improvement, or workflow enhancement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area / Раздел программы
      options:
        - "Image Inspection (Образ)"
        - "Apps / Appx & MSIX (Приложения)"
        - "Features & Capabilities (Компоненты)"
        - "Updates & Cleanup (Обновления)"
        - "Drivers (Драйверы)"
        - "Offline Registry (Реестр)"
        - "Custom Files (Файлы)"
        - "Build / ISO / Presets (Сборка и пресеты)"
        - "Settings / Updater / UI"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case / Какую задачу это решает?
      description: Describe the workflow or pain point you want to improve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Предлагаемое решение
      description: How would you like this feature to work in ISOCraft?
    validations:
      required: false
